<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | XNEON Technologies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #ffffff; font-family: sans-serif; }
        .glass { background: #111; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="navbar"></div>

    <main class="max-w-md mx-auto p-4 pb-20">
        <h1 class="text-2xl font-bold mb-6">Shopping Cart</h1>
        
        <div id="status-box" class="p-3 mb-4 rounded-lg bg-gray-900 text-xs border border-gray-800">
            Connecting...
        </div>

        <div id="cart-container" class="space-y-4"></div>

        <div id="checkout-section" class="mt-8 border-t border-gray-800 pt-4 hidden">
            <div class="flex justify-between text-lg font-bold mb-4">
                <span>Total</span>
                <span id="cart-total">₹0</span>
            </div>
            <button onclick="document.getElementById('checkout-modal').classList.remove('hidden')" 
                    class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-700">PROCEED TO CHECKOUT</button>
        </div>
    </main>

    <div id="checkout-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="glass p-6 rounded-2xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Shipping Details</h2>
            <input id="name" type="text" placeholder="Full Name" class="w-full bg-black p-3 mb-2 rounded border border-gray-700">
            <input id="address" type="text" placeholder="Address" class="w-full bg-black p-3 mb-2 rounded border border-gray-700">
            <select id="payment" class="w-full bg-black p-3 mb-4 rounded border border-gray-700">
                <option value="COD">Cash on Delivery</option>
                <option value="UPI">Online Payment</option>
            </select>
            <button onclick="placeOrder()" class="w-full bg-green-600 py-3 rounded-xl font-bold">CONFIRM ORDER</button>
        </div>
    </div>

    <div id="success-overlay" class="fixed inset-0 bg-[#050505] z-[100] hidden flex flex-col items-center justify-center">
        <div class="text-green-500 text-7xl mb-4 animate-bounce"><i class="fas fa-check-circle"></i></div>
        <p class="font-bold text-xl">Order Placed!</p>
    </div>

    <script type="module">
        import { db, auth, loadNavbar, collection, onSnapshot, deleteDoc, updateDoc, doc, addDoc, writeBatch, serverTimestamp, formatINR } from './firebase-config.js';

        const status = document.getElementById('status-box');
        const container = document.getElementById('cart-container');
        const checkoutSection = document.getElementById('checkout-section');
        
        let cartItems = [];
        let total = 0;

        // 1. Initialize Navbar
        try { loadNavbar(); status.innerText = "System Ready."; } 
        catch(e) { status.innerText = "Navbar Error: " + e.message; status.className = "p-3 bg-red-900"; }

        // 2. Load Cart
        auth.onAuthStateChanged(user => {
            if(!user) return status.innerText = "Please Login.";
            
            onSnapshot(collection(db, "carts", user.uid, "items"), snap => {
                container.innerHTML = "";
                cartItems = [];
                total = 0;

                if(snap.empty) { status.innerText = "Cart Empty."; checkoutSection.classList.add('hidden'); return; }
                
                checkoutSection.classList.remove('hidden');
                snap.forEach(d => {
                    const item = { ...d.data(), id: d.id };
                    cartItems.push(item);
                    total += (item.price * item.qty);
                    container.innerHTML += `
                        <div class="glass flex items-center p-3 rounded-xl gap-3">
                            <img src="${item.image}" class="w-12 h-12 rounded bg-gray-800">
                            <div class="flex-1 text-sm font-bold">${item.name}</div>
                            <div class="flex items-center gap-2">
                                <button onclick="window.updateQty('${item.id}', ${item.qty-1})" class="px-2">−</button>
                                <span>${item.qty}</span>
                                <button onclick="window.updateQty('${item.id}', ${item.qty+1})" class="px-2">+</button>
                            </div>
                            <button onclick="window.removeItem('${item.id}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </div>`;
                });
                document.getElementById('cart-total').innerText = formatINR(total);
            });
        });

        // 3. Logic Functions
        window.updateQty = async (id, qty) => {
            if(qty < 1) return window.removeItem(id);
            await updateDoc(doc(db, "carts", auth.currentUser.uid, "items", id), { qty });
        };

        window.removeItem = async (id) => {
            await deleteDoc(doc(db, "carts", auth.currentUser.uid, "items", id));
        };

        window.placeOrder = async () => {
            const batch = writeBatch(db);
            await addDoc(collection(db, "orders"), {
                userId: auth.currentUser.uid, items: cartItems, total: total,
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                payment: document.getElementById('payment').value,
                timestamp: serverTimestamp()
            });

            cartItems.forEach(i => batch.delete(doc(db, "carts", auth.currentUser.uid, "items", i.id)));
            await batch.commit();

            document.getElementById('checkout-modal').classList.add('hidden');
            document.getElementById('success-overlay').classList.remove('hidden');
            setTimeout(() => window.location.href = "orders", 2000);
        };
    </script>
</body>
</html>

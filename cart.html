<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | XNEON Technologies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-panel { background: #111111; border: 1px solid #222222; }
        input, select { background: #050505 !important; border: 1px solid #222222 !important; transition: 0.3s; }
        input:focus { border-color: #3b82f6 !important; outline: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
        
        /* Green Tick Animation */
        .checkmark { width: 80px; height: 80px; border-radius: 50%; display: block; stroke-width: 4; stroke: #22c55e; stroke-miterlimit: 10; margin: 0 auto; }
        .checkmark__circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 4; stroke-miterlimit: 10; stroke: #22c55e; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
    </style>
</head>
<body class="pb-20">
    <div id="navbar"></div>

    <main class="max-w-4xl mx-auto p-6 pt-12">
        <h1 class="text-3xl font-bold mb-8 tracking-tight">Shopping Cart</h1>

        <div id="cart-items" class="space-y-4 w-full">
            <div class="animate-pulse bg-gray-900 h-24 rounded-2xl"></div>
        </div>

        <div class="mt-10 glass-panel p-6 rounded-3xl">
            <div class="flex justify-between items-center text-xl font-bold mb-6">
                <span>Total Amount</span>
                <span id="cart-total" class="text-blue-500">₹0</span>
            </div>
            <button onclick="openCheckout()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-[1.02]">
                PROCEED TO CHECKOUT
            </button>
        </div>
    </main>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-lg relative max-h-[90vh] overflow-y-auto">
            <button onclick="document.getElementById('checkout-modal').classList.add('hidden')" class="absolute top-4 right-6 text-gray-400 hover:text-white text-3xl">&times;</button>
            <h2 class="text-2xl font-bold mb-6">Shipping Details</h2>

            <div class="space-y-4">
                <input type="text" id="ship-name" placeholder="Full Name" class="w-full p-4 rounded-xl">
                <input type="tel" id="ship-phone" placeholder="Phone Number" class="w-full p-4 rounded-xl">
                <input type="text" id="ship-address" placeholder="House No, Street, Area" class="w-full p-4 rounded-xl">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="ship-city" placeholder="City" class="p-4 rounded-xl">
                    <input type="text" id="ship-state" placeholder="State" class="p-4 rounded-xl">
                </div>
                <input type="text" id="ship-zip" placeholder="PIN Code" class="w-full p-4 rounded-xl">
                
                <!-- Added onchange event here to block Online Payment -->
                <select id="payment-method" class="w-full p-4 rounded-xl" onchange="checkPaymentMethod()">
                    <option value="COD">Cash on Delivery (COD)</option>
                    <option value="UPI">Online Payment (UPI/Card)</option>
                </select>
            </div>

            <button id="confirm-btn" onclick="placeOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl mt-6 transition-all">CONFIRM ORDER</button>
        </div>
    </div>

    <!-- Success Animation Modal -->
    <div id="success-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] hidden flex items-center justify-center">
        <div class="text-center">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
            <h2 class="text-3xl font-bold text-green-500 mt-6 mb-2">Order Confirmed!</h2>
            <!-- Removed the payment confirmed text here -->
            <p class="text-gray-400">Redirecting...</p>
        </div>
    </div>

    <script type="module">
        import { db, auth, loadNavbar, collection, onSnapshot, deleteDoc, addDoc, formatINR, serverTimestamp, doc, updateDoc } from './firebase-config.js';
        loadNavbar();

        const cartDiv = document.getElementById('cart-items');
        const totalSpan = document.getElementById('cart-total');
        let cartTotal = 0;
        let cartData = [];

        auth.onAuthStateChanged(user => {
            if(user) {
                onSnapshot(collection(db, "carts", user.uid, "items"), (snap) => {
                    cartDiv.innerHTML = "";
                    cartTotal = 0;
                    cartData = [];
                    if(snap.empty) {
                        cartDiv.innerHTML = "<p class='text-gray-500 text-center py-10'>Your cart is empty.</p>";
                        totalSpan.innerText = formatINR(0);
                        return;
                    }
                    snap.forEach(d => {
                        const item = d.data();
                        cartData.push({ id: d.id, ...item }); 
                        cartTotal += (item.price * item.qty);
                        
                        // Added 'min-w-0' to text container, 'truncate' to title, and 'flex-shrink-0' to fixed elements to fix layout
                        cartDiv.innerHTML += `
                        <div class="glass-panel flex items-center gap-3 p-4 rounded-2xl w-full">
                            <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg flex-shrink-0">
                            
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-base truncate">${item.name}</h3>
                                <p class="text-sm text-gray-400">${formatINR(item.price)}</p>
                            </div>
                            
                            <!-- Plus/Minus Quantity Controls -->
                            <div class="flex items-center gap-2 bg-[#050505] border border-[#222] rounded-xl px-2 py-1 flex-shrink-0">
                                <button onclick="updateQty('${d.id}', ${item.qty}, -1)" class="text-gray-400 hover:text-white font-bold text-lg px-1">-</button>
                                <span class="w-5 text-center font-bold text-sm">${item.qty}</span>
                                <button onclick="updateQty('${d.id}', ${item.qty}, 1)" class="text-gray-400 hover:text-white font-bold text-lg px-1">+</button>
                            </div>

                            <!-- Cross Button for Removal -->
                            <button onclick="removeItem('${d.id}')" class="text-gray-500 hover:text-red-500 text-2xl flex-shrink-0 ml-1 pl-1 pr-1 pb-1">&times;</button>
                        </div>`;
                    });
                    totalSpan.innerText = formatINR(cartTotal);
                });
            }
        });

        // Function to check and block online payment
        window.checkPaymentMethod = () => {
            const select = document.getElementById('payment-method');
            if (select.value === 'UPI') {
                alert("The online payment option is currently unavailable. Please select Cash on Delivery (COD).");
                select.value = 'COD'; // Reverts the dropdown back to COD automatically
            }
        };

        window.updateQty = async (id, currentQty, change) => {
            if(!auth.currentUser) return;
            const newQty = currentQty + change;
            
            if (newQty <= 0) {
                await removeItem(id);
            } else {
                await updateDoc(doc(db, "carts", auth.currentUser.uid, "items", id), { qty: newQty });
            }
        };

        window.removeItem = async (id) => { 
            if(auth.currentUser) {
                await deleteDoc(doc(db, "carts", auth.currentUser.uid, "items", id)); 
            }
        };

        window.openCheckout = () => { 
            if(cartTotal > 0) document.getElementById('checkout-modal').classList.remove('hidden'); 
            else alert("Cart is empty"); 
        };

        window.placeOrder = async () => {
            const data = {
                name: document.getElementById('ship-name').value,
                phone: document.getElementById('ship-phone').value,
                address: document.getElementById('ship-address').value,
                city: document.getElementById('ship-city').value,
                state: document.getElementById('ship-state').value,
                zip: document.getElementById('ship-zip').value,
                payment: document.getElementById('payment-method').value
            };

            if(!data.name || !data.address || !data.zip || !data.phone) {
                return alert("Please fill in all shipping details.");
            }

            const user = auth.currentUser;
            if(user) {
                const btn = document.getElementById('confirm-btn');
                btn.innerText = "Processing...";
                btn.disabled = true;

                // 1. Create the Order (Status set to Pending since it's COD)
                await addDoc(collection(db, "orders"), {
                    userId: user.uid, 
                    items: cartData, 
                    total: cartTotal,
                    ...data, 
                    status: "Pending", 
                    timestamp: serverTimestamp()
                });

                // 2. Auto-remove items from the user's cart
                for (let i = 0; i < cartData.length; i++) {
                    await deleteDoc(doc(db, "carts", user.uid, "items", cartData[i].id));
                }

                // 3. Show Green Tick Animation
                document.getElementById('checkout-modal').classList.add('hidden');
                document.getElementById('success-modal').classList.remove('hidden');

                // 4. Redirect after animation plays (2.5 seconds)
                setTimeout(() => {
                    window.location.href = "orders";
                }, 2500);
            }
        };
    </script>
</body>
</html>

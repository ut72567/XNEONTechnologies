<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | XNEON Technologies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-panel { background: #111111; border: 1px solid #222222; }
    </style>
</head>
<body class="pb-20">

    <div id="navbar"></div>

    <main class="max-w-4xl mx-auto p-6 pt-12">
        <h1 class="text-3xl font-bold mb-8">Shopping Cart</h1>
        
        <div id="cart-items" class="space-y-4">
            <div id="loading-spinner" class="text-center py-10 text-gray-500">
                <i class="fas fa-spinner fa-spin text-2xl"></i> Loading your gear...
            </div>
        </div>

        <div class="mt-10 glass-panel p-6 rounded-3xl">
            <div class="flex justify-between items-center text-xl font-bold mb-6">
                <span>Total</span>
                <span id="cart-total" class="text-blue-500">₹0</span>
            </div>
            <button onclick="openCheckout()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all">PROCEED TO CHECKOUT</button>
        </div>
    </main>

    <div id="success-overlay" class="fixed inset-0 bg-[#050505] z-[100] hidden flex flex-col items-center justify-center">
        <div class="text-green-500 text-8xl mb-6 animate-bounce"><i class="fas fa-check-circle"></i></div>
        <h2 class="text-3xl font-bold">Order Confirmed!</h2>
    </div>

    <script type="module">
        import { db, auth, loadNavbar, collection, onSnapshot, deleteDoc, updateDoc, doc, addDoc, writeBatch, serverTimestamp, formatINR } from './firebase-config.js';
        
        // 1. Load Navbar Immediately
        loadNavbar();

        // 2. Logic for Cart
        const cartDiv = document.getElementById('cart-items');
        const spinner = document.getElementById('loading-spinner');

        auth.onAuthStateChanged(user => {
            if(user) {
                onSnapshot(collection(db, "carts", user.uid, "items"), (snap) => {
                    spinner.style.display = 'none'; // Hide loader
                    cartDiv.innerHTML = "";
                    let total = 0;
                    
                    if(snap.empty) {
                        cartDiv.innerHTML = "<p class='text-center text-gray-500'>Your cart is empty.</p>";
                        return;
                    }

                    snap.forEach(d => {
                        const item = { ...d.data(), id: d.id };
                        total += (item.price * item.qty);
                        cartDiv.innerHTML += `
                        <div class="glass-panel flex items-center gap-4 p-4 rounded-2xl">
                            <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
                            <div class="flex-1">
                                <h3 class="font-bold">${item.name}</h3>
                                <p class="text-blue-400">${formatINR(item.price)}</p>
                            </div>
                            <div class="flex items-center gap-3 bg-[#050505] p-1 rounded-lg border border-[#222222]">
                                <button onclick="updateQty('${item.id}', ${item.qty - 1})" class="px-3">−</button>
                                <span class="w-6 text-center font-bold">${item.qty}</span>
                                <button onclick="updateQty('${item.id}', ${item.qty + 1})" class="px-3">+</button>
                            </div>
                            <button onclick="removeItem('${item.id}')" class="text-gray-500 hover:text-red-500"><i class="fas fa-trash"></i></button>
                        </div>`;
                    });
                    document.getElementById('cart-total').innerText = formatINR(total);
                });
            } else {
                spinner.innerHTML = "Please log in to view your cart.";
            }
        });

        // Make functions globally accessible for the onclick buttons
        window.updateQty = async (id, qty) => {
            if (qty < 1) return removeItem(id);
            await updateDoc(doc(db, "carts", auth.currentUser.uid, "items", id), { qty });
        };

        window.removeItem = async (id) => {
            await deleteDoc(doc(db, "carts", auth.currentUser.uid, "items", id));
        };
    </script>
</body>
</html>

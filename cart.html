<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | XNEON Technologies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-panel { background: #111111; border: 1px solid #222222; }
        input, select { background: #050505 !important; border: 1px solid #222222 !important; transition: 0.3s; }
        input:focus { border-color: #3b82f6 !important; outline: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="pb-20">
    <div id="navbar"></div>

    <main class="max-w-4xl mx-auto p-6 pt-12">
        <h1 class="text-3xl font-bold mb-8">Shopping Cart</h1>
        <div id="cart-items" class="space-y-4">
            <div class="animate-pulse bg-gray-900 h-24 rounded-2xl"></div>
        </div>

        <div class="mt-10 glass-panel p-6 rounded-3xl">
            <div class="flex justify-between items-center text-xl font-bold mb-6">
                <span>Total</span>
                <span id="cart-total" class="text-blue-500">₹0</span>
            </div>
            <button onclick="openCheckout()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all">PROCEED TO CHECKOUT</button>
        </div>
    </main>

    <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-lg relative max-h-[90vh] overflow-y-auto">
            <button onclick="document.getElementById('checkout-modal').classList.add('hidden')" class="absolute top-4 right-6 text-2xl">&times;</button>
            <h2 class="text-2xl font-bold mb-6">Shipping Details</h2>
            <div class="space-y-4">
                <input type="text" id="name" placeholder="Full Name" class="w-full p-4 rounded-xl">
                <input type="tel" id="phone" placeholder="Phone Number" class="w-full p-4 rounded-xl">
                <input type="text" id="address" placeholder="Address" class="w-full p-4 rounded-xl">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="city" placeholder="City" class="p-4 rounded-xl">
                    <input type="text" id="state" placeholder="State" class="p-4 rounded-xl">
                </div>
                <input type="text" id="zip" placeholder="PIN Code" class="w-full p-4 rounded-xl">
                <select id="payment" class="w-full p-4 rounded-xl">
                    <option value="COD">Cash on Delivery (COD)</option>
                    <option value="UPI">Online Payment</option>
                </select>
            </div>
            <button onclick="placeOrder()" class="w-full bg-green-600 hover:bg-green-700 py-4 rounded-xl mt-6 font-bold">CONFIRM ORDER</button>
        </div>
    </div>

    <div id="success-overlay" class="fixed inset-0 bg-[#050505] z-[100] hidden flex flex-col items-center justify-center">
        <div class="text-green-500 text-8xl mb-6 animate-bounce"><i class="fas fa-check-circle"></i></div>
        <h2 class="text-3xl font-bold">Order Confirmed!</h2>
    </div>

    <script type="module">
        import { db, auth, loadNavbar, collection, onSnapshot, deleteDoc, updateDoc, doc, addDoc, writeBatch, serverTimestamp, formatINR } from './firebase-config.js';
        loadNavbar();

        let cartTotal = 0;
        let cartItems = [];

        auth.onAuthStateChanged(user => {
            if(user) {
                onSnapshot(collection(db, "carts", user.uid, "items"), (snap) => {
                    const cartDiv = document.getElementById('cart-items');
                    cartDiv.innerHTML = "";
                    cartTotal = 0;
                    cartItems = [];
                    snap.forEach(d => {
                        const item = { ...d.data(), id: d.id };
                        cartItems.push(item);
                        cartTotal += (item.price * item.qty);
                        cartDiv.innerHTML += `
                        <div class="glass-panel flex items-center gap-4 p-4 rounded-2xl">
                            <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
                            <div class="flex-1">
                                <h3 class="font-bold">${item.name}</h3>
                                <p class="text-blue-400">${formatINR(item.price)}</p>
                            </div>
                            <div class="flex items-center gap-3 bg-[#050505] p-1 rounded-lg border border-[#222222]">
                                <button onclick="updateQty('${item.id}', ${item.qty - 1})" class="px-3">−</button>
                                <span class="w-6 text-center font-bold">${item.qty}</span>
                                <button onclick="updateQty('${item.id}', ${item.qty + 1})" class="px-3">+</button>
                            </div>
                            <button onclick="removeItem('${item.id}')" class="text-gray-500 hover:text-red-500"><i class="fas fa-trash"></i></button>
                        </div>`;
                    });
                    document.getElementById('cart-total').innerText = formatINR(cartTotal);
                });
            }
        });

        window.updateQty = async (id, qty) => {
            if (qty < 1) return removeItem(id);
            await updateDoc(doc(db, "carts", auth.currentUser.uid, "items", id), { qty });
        };

        window.removeItem = async (id) => {
            await deleteDoc(doc(db, "carts", auth.currentUser.uid, "items", id));
        };

        window.openCheckout = () => {
            if(cartTotal > 0) document.getElementById('checkout-modal').classList.remove('hidden');
        };

        window.placeOrder = async () => {
            const user = auth.currentUser;
            const batch = writeBatch(db);
            
            await addDoc(collection(db, "orders"), {
                userId: user.uid, items: cartItems, total: cartTotal,
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                payment: document.getElementById('payment').value,
                timestamp: serverTimestamp()
            });

            cartItems.forEach(item => batch.delete(doc(db, "carts", user.uid, "items", item.id)));
            await batch.commit();

            document.getElementById('checkout-modal').classList.add('hidden');
            document.getElementById('success-overlay').classList.remove('hidden');
            setTimeout(() => { window.location.href = "orders"; }, 2000);
        };
    </script>
</body>
</html>
